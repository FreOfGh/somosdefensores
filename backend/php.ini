; PHP configuration for the Laravel backend.
; Ensures PostgreSQL is the active PDO driver and configures upload/POST limits.

extension=pdo_pgsql
extension=pgsql
pdo.default_driver = pgsql

upload_max_filesize = 100M
post_max_size = 200M
max_file_uploads = 40

memory_limit = 256M
max_execution_time = 300
max_input_time = 300
